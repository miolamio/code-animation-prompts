name: Validate library and skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/translation tests read upstream commit 103ac7e from history.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s scripts/translation
        env:
          PYTHONUTF8: '1'
      - run: python skills/code-animation-prompts/scripts/styles.py search ink --limit 3
      - run: python skills/code-animation-prompts/scripts/styles.py show B3
